<!doctype html>
<!-- HOW TO USE (this page is a template)
     Title: in the <title>, the <h1> and the `LINES` array of the script (the particles draw the title).
     Projects: in the four <a> links of this page (name, short line and #project-N address).
     Icons: the `ICONS` array of the script: the particles melt into the shapes of ../assets/project-N.svg.
     Also replace the #project-1 ... #project-4 links with the addresses of your own projects. -->
<!-- 23 · Particles — thirty thousand points of light form the title, then dissolve into the icons of the four projects;
     they breathe, scatter from the finger and reassemble. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Your open space by First Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: #fff6ea; -webkit-tap-highlight-color: transparent; }
  body {
    background:
      radial-gradient(80% 45% at 50% 8%, rgba(60, 90, 170, .28) 0%, rgba(60, 90, 170, 0) 70%),
      radial-gradient(90% 50% at 50% 100%, rgba(255, 140, 50, .16) 0%, rgba(255, 140, 50, 0) 70%),
      #07080d;
  }
  #stage { position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, 480px); transform: translateX(-50%); touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  h1 {
    position: absolute; z-index: 2; margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400;
    line-height: 1; letter-spacing: .002em; opacity: 0; transition: opacity .9s ease; pointer-events: none;
    text-shadow: 0 0 22px rgba(255, 200, 140, .25);
  }
  h1 span { display: block; }
  h1.on { opacity: 1; }
  .area {
    position: absolute; z-index: 3; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    color: inherit; text-decoration: none; border-radius: 24px; opacity: 0; transition: opacity .8s ease;
  }
  .area.on { opacity: 1; }
  .area .lab { text-align: center; font-family: Karla, system-ui, sans-serif; padding: 2px 6px; }
  .area b { display: block; font-size: 17px; font-weight: 700; }
  .area i { display: block; font-style: normal; font-size: 13.5px; color: rgba(255, 230, 200, .66); margin-top: 1px; }
  .area:active b { color: #ffb21e; }
  .area:focus-visible { outline: 2px solid #ffb21e; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <h1 id="title"><span>Your open space</span><span>by First Last</span></h1>
  <a class="area" href="#project-1" data-i="0"><span class="lab"><b>Project one</b><i>a short line</i></span></a>
  <a class="area" href="#project-2" data-i="1"><span class="lab"><b>Project two</b><i>a short line</i></span></a>
  <a class="area" href="#project-3" data-i="2"><span class="lab"><b>Project three</b><i>a short line</i></span></a>
  <a class="area" href="#project-4" data-i="3"><span class="lab"><b>Project four</b><i>a short line</i></span></a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const IMG = "../assets/";
  const ICONS = ["project-1.svg", "project-2.svg", "project-3.svg", "project-4.svg"];
  const LINES = ["Your open space", "by First Last"];
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("c");
  const titleEl = document.getElementById("title");
  const areas = [...document.querySelectorAll(".area")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(devicePixelRatio || 1, 2);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
  renderer.setPixelRatio(dpr);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);

  let W = 1, H = 1;
  const N = (Math.min(innerWidth, 480) < 500 ? 32000 : 40000) - ((Math.min(innerWidth, 480) < 500 ? 32000 : 40000) % 4);

  const geo = new THREE.BufferGeometry();
  const aShape = new Float32Array(N * 3), aStart = new Float32Array(N * 3), aTitle = new Float32Array(N * 3);
  const aColor = new Float32Array(N * 3), aRand = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    aRand[i * 4] = Math.random();                 // delay
    aRand[i * 4 + 1] = Math.pow(Math.random(), 2); // size
    aRand[i * 4 + 2] = Math.random();             // phase
    aRand[i * 4 + 3] = .4 + Math.random() * 1.1;  // breathing speed
  }
  geo.setAttribute("position", new THREE.BufferAttribute(aShape, 3));
  geo.setAttribute("aStart", new THREE.BufferAttribute(aStart, 3));
  geo.setAttribute("aTitle", new THREE.BufferAttribute(aTitle, 3));
  geo.setAttribute("aColor", new THREE.BufferAttribute(aColor, 3));
  geo.setAttribute("aRand", new THREE.BufferAttribute(aRand, 4));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);

  const uniforms = {
    uT1: { value: 0 }, uT2: { value: 0 }, uTime: { value: 0 }, uPress: { value: 0 }, uBurst: { value: 0 },
    uPointer: { value: new THREE.Vector2(-9999, -9999) }, uDpr: { value: dpr },
  };
  const mat = new THREE.ShaderMaterial({
    uniforms, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uT1, uT2, uTime, uPress, uBurst, uDpr;
      uniform vec2 uPointer;
      attribute vec3 aStart, aTitle, aColor;
      attribute vec4 aRand;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = aRand.x;
        float e1 = smoothstep(d * .45, d * .45 + .55, uT1);
        float e2 = smoothstep(d * .45, d * .45 + .55, uT2);
        vec3 p = mix(aStart, aTitle, e1);
        p = mix(p, position, e2);
        float ph = aRand.z * 6.2831853;
        float travel = sin(3.14159 * e1) * (1.0 - e2) + sin(3.14159 * e2);
        p.xy += vec2(sin(ph + uTime * .7), cos(ph * 1.3 + uTime * .6)) * travel * 38.0;
        p.xy += vec2(sin(uTime * aRand.w + ph), cos(uTime * aRand.w * 1.21 + ph)) * (.45 + 1.15 * e2);
        vec2 dv = p.xy - uPointer;
        float dist = length(dv);
        float f = uPress * exp(-dist * dist / (2.0 * 62.0 * 62.0));
        p.xy += dv / (dist + .001) * f * 72.0;
        p.xy += vec2(sin(ph * 3.0), cos(ph * 2.0)) * uBurst * 60.0 * (.4 + aRand.y) * f;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p.xy, 0.0, 1.0);
        gl_PointSize = (1.25 + aRand.y * 1.7) * uDpr * (1.0 + .3 * travel + .6 * f);
        vColor = mix(vec3(1.0, .93, .82), aColor, e2) * (1.0 + .8 * f);
        vAlpha = (.5 + .5 * aRand.y) * min(1.0, uT1 * 3.0 + e2);
      }`,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - .5);
        if (r > .5) discard;
        float a = smoothstep(.5, .05, r) * vAlpha;
        gl_FragColor = vec4(vColor * a, a);
      }`,
  });
  scene.add(new THREE.Points(geo, mat));

  // ---------- Sampling: text and icons become lists of points ----------
  const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  let images = [];
  let titleBox = { x: 24, y: 30, fs: 40 }, cells = [];

  function sampleTitle() {
    const pad = 24, maxW = W - pad * 2;
    const c = document.createElement("canvas"), g = c.getContext("2d");
    g.font = `100px Anton, Impact, sans-serif`;
    const wide = Math.max(...LINES.map((l) => g.measureText(l).width));
    const fs = Math.min(54, Math.floor(maxW / wide * 100));
    const top = Math.max(30, safe.top + 18);
    titleBox = { x: pad, y: top, fs };
    const sc = 2;
    c.width = Math.ceil(maxW * sc); c.height = Math.ceil(fs * LINES.length * 1.06 * sc);
    g.scale(sc, sc); g.fillStyle = "#fff"; g.textBaseline = "top"; g.font = `${fs}px Anton, Impact, sans-serif`;
    LINES.forEach((l, i) => g.fillText(l, 0, i * fs + fs * .02));
    const data = g.getImageData(0, 0, c.width, c.height).data, pts = [];
    for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) {
      if (data[(y * c.width + x) * 4 + 3] > 120) pts.push(pad + x / sc, top + y / sc);
    }
    Object.assign(titleEl.style, { left: pad + "px", top: top + "px", fontSize: fs + "px" });
    return pts;
  }

  function sampleIcon(img, size) {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const g = c.getContext("2d");
    if (img) g.drawImage(img, 0, 0, size, size);
    const data = g.getImageData(0, 0, size, size).data, pts = [];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const k = (y * size + x) * 4;
      if (data[k + 3] > 70) pts.push(x - size / 2, y - size / 2, data[k] / 255, data[k + 1] / 255, data[k + 2] / 255);
    }
    if (!pts.length) for (let a = 0; a < 6.28; a += .01) pts.push(Math.cos(a) * size / 2.2, Math.sin(a) * size / 2.2, 1, .7, .3);
    return pts;
  }

  // iPhone margins (notch and bottom bar)
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
  document.body.append(probe);
  const safe = { top: 0, bottom: 0 };
  function build() {
    const cs = getComputedStyle(probe); safe.top = parseFloat(cs.paddingTop) || 0; safe.bottom = parseFloat(cs.paddingBottom) || 0;
    W = stage.clientWidth; H = stage.clientHeight;
    renderer.setSize(W, H, false);
    // camera in CSS pixels: x from the left, y pointing up (the screen is flipped in place)
    Object.assign(camera, { left: 0, right: W, top: 0, bottom: -H });
    camera.updateProjectionMatrix();

    const title = sampleTitle();
    const titleBottom = titleBox.y + titleBox.fs * LINES.length + 30;
    const bottom = H - Math.max(20, safe.bottom + 12);
    const gapX = 18, gapY = 22, colW = (W - 48 - gapX) / 2, rowH = (bottom - titleBottom - gapY) / 2;
    const S = Math.floor(Math.max(70, Math.min(colW * .8, rowH - 58)));
    cells = [0, 1, 2, 3].map((i) => {
      const col = i % 2, row = (i / 2) | 0;
      const x0 = 24 + col * (colW + gapX), y0 = titleBottom + row * (rowH + gapY);
      return { x0, y0, w: colW, h: rowH, cx: x0 + colW / 2, cy: y0 + (rowH - 50) / 2, S };
    });
    const shapes = cells.map((c, i) => sampleIcon(images[i], S));

    const cx = W / 2, cy = H * .45;
    for (let i = 0; i < N; i++) {
      // initial cloud
      const a = Math.random() * 6.283, r = Math.sqrt(-2 * Math.log(Math.random() + 1e-6)) * W * .28;
      aStart[i * 3] = cx + Math.cos(a) * r; aStart[i * 3 + 1] = -(cy + Math.sin(a) * r * 1.3);
      // title
      const t = ((Math.random() * title.length / 2) | 0) * 2;
      aTitle[i * 3] = title[t] + (Math.random() - .5) * .9; aTitle[i * 3 + 1] = -(title[t + 1] + (Math.random() - .5) * .9);
      // project shape (the four projects mix into the title)
      const q = i % 4, pts = shapes[q], c = cells[q], k = ((Math.random() * pts.length / 5) | 0) * 5;
      aShape[i * 3] = c.cx + pts[k] + (Math.random() - .5) * .8; aShape[i * 3 + 1] = -(c.cy + pts[k + 1] + (Math.random() - .5) * .8);
      aColor[i * 3] = Math.min(1, pts[k + 2] * 1.12 + .05); aColor[i * 3 + 1] = Math.min(1, pts[k + 3] * 1.12 + .05); aColor[i * 3 + 2] = Math.min(1, pts[k + 4] * 1.12 + .07);
    }
    ["position", "aStart", "aTitle", "aColor"].forEach((n) => (geo.attributes[n].needsUpdate = true));

    areas.forEach((el, i) => {
      const c = cells[i];
      Object.assign(el.style, { left: c.x0 + "px", top: c.y0 + "px", width: c.w + "px", height: c.h + "px" });
    });
    draw();
  }

  // ---------- Time and finger ----------
  let start = 0, raf = 0, last = 0, press = 0, pressTarget = 0, downAt = null, moved = 0;
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
  function setPointer(e) {
    const r = stage.getBoundingClientRect();
    uniforms.uPointer.value.set(e.clientX - r.left, -(e.clientY - r.top));
  }
  stage.addEventListener("pointerdown", (e) => { setPointer(e); pressTarget = 1; downAt = { x: e.clientX, y: e.clientY }; moved = 0; uniforms.uBurst.value = 1; kick(); });
  stage.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" && !downAt) { setPointer(e); pressTarget = .55; kick(); return; }
    if (!downAt) return;
    setPointer(e); moved = Math.max(moved, Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y));
  });
  const release = () => { pressTarget = 0; downAt = null; };
  stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);
  stage.addEventListener("pointerleave", () => { pressTarget = 0; });

  areas.forEach((el) => el.addEventListener("click", (e) => {
    if (moved > 10) { e.preventDefault(); return; }               // it was playing with the finger, not a tap
    if (reduce) return;
    e.preventDefault();
    setTimeout(() => { location.href = el.href; }, 360);
  }));

  function step(now) {
    const s = (now - start) / 1000;
    uniforms.uTime.value = s;
    uniforms.uT1.value = ease((s - .25) / 1.7);
    uniforms.uT2.value = ease((s - 2.6) / 1.8);
    if (s > 2.75) titleEl.classList.add("on");
    if (s > 3.7) areas.forEach((a) => a.classList.add("on"));
    const k = pressTarget > press ? .2 : .055;                  // they scatter fast, return slowly
    press += (pressTarget - press) * Math.min(1, k * 60 * ((now - last) / 1000 || .016));
    uniforms.uPress.value = press;
    uniforms.uBurst.value *= .9;
  }
  function draw() { renderer.render(scene, camera); }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    step(now); last = now; draw();
  }
  function kick() {
    if (reduce) return draw();
    if (!raf && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else kick();
  });
  addEventListener("resize", () => { build(); });

  const ready = document.fonts ? Promise.all([document.fonts.load("100px Anton"), document.fonts.ready]) : Promise.resolve();
  Promise.all([ready, ...ICONS.map((f) => loadImg(IMG + f))]).then((res) => {
    images = res.slice(1);
    build();
    if (reduce) {
      uniforms.uT1.value = 1; uniforms.uT2.value = 1; uniforms.uTime.value = 0;
      titleEl.classList.add("on"); areas.forEach((a) => a.classList.add("on"));
      draw(); return;
    }
    start = performance.now(); kick();
  });
})();
</script>
</body>
</html>
