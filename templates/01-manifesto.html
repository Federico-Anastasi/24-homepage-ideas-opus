<!doctype html>
<!-- HOW TO USE (this page is a template)
     Title: in the <title> and the <h1>, split in several elements around the word "open" (search for "First Last").
     Projects: in the four <a> links of this page (name, short line and #project-N address).
     Icons: this version uses no images: the projects are text only.
     Also replace the #project-1 ... #project-4 links with the addresses of your own projects. -->
<!-- 01 · Swiss manifesto: white, black and one red. Strict grid, huge title in condensed Archivo,
     four typographic rows separated by rules. The only motion: the red rule that draws itself on load. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Your open space by First Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --red: #e2231a;
    --pad: clamp(14px, 4.6vw, 22px);
    --rule: 2px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; color: var(--ink); }
  body {
    font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  main {
    position: relative; height: 100svh; max-width: 480px; margin: 0 auto;
    display: grid; grid-template-rows: auto auto 1fr;
    padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) max(var(--pad), env(safe-area-inset-bottom));
  }

  /* The title: a black, condensed, tightly packed block */
  h1 {
    font-weight: 860; font-variation-settings: "wdth" 70;
    font-size: min(18.2vw, 10.4svh, 88px); line-height: .84; letter-spacing: -.03em;
    margin-left: -.04em;
  }
  h1 .r { color: var(--red); }

  /* The detail: a third of the grid in red, drawing itself from the left */
  .bar { display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 8px; margin-top: clamp(10px, 2.2svh, 20px); }
  .bar i { grid-column: 1 / 3; height: 7px; background: var(--red); transform-origin: left; animation: draw .9s cubic-bezier(.7, 0, .2, 1) .25s both; }
  @keyframes draw { from { transform: scaleX(0); } }

  /* The four rows */
  nav { display: grid; grid-template-rows: repeat(4, 1fr); margin-top: clamp(10px, 2.2svh, 20px); border-top: var(--rule) solid var(--ink); }
  nav a {
    position: relative; display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 8px; align-items: end;
    padding: clamp(6px, 1.2svh, 10px) 0 clamp(7px, 1.4svh, 11px);
    border-bottom: var(--rule) solid var(--ink); color: inherit; text-decoration: none;
    min-height: 44px;
  }
  .name {
    grid-column: 1 / 5; align-self: end;
    font-weight: 820; font-variation-settings: "wdth" 76;
    font-size: min(10.6vw, 6svh, 48px); line-height: .86; letter-spacing: -.025em;
  }
  .meta { grid-column: 5 / 7; align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; text-align: right; }
  .terr { font-weight: 640; font-variation-settings: "wdth" 92; font-size: clamp(11px, 3.1vw, 13px); line-height: 1.1; padding-top: 2px; }
  .say { font-weight: 520; font-variation-settings: "wdth" 96; font-size: clamp(12px, 3.4vw, 14px); line-height: 1.12; color: var(--red); }
  .arrow { display: inline-block; font-weight: 700; transition: transform .18s ease; }
  nav a:hover .arrow { transform: translateX(3px); }
  nav a:active { background: var(--red); color: #fff; }
  nav a:active .say { color: #fff; }
  nav a:focus-visible { outline: 3px solid var(--red); outline-offset: -3px; }

  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Your <span class="r">open</span> space by First Last</h1>
  <div class="bar" aria-hidden="true"><i></i></div>
  <nav aria-label="Projects">
    <a href="#project-1"><span class="name">Project one</span><span class="meta"><span class="terr">Category</span><span class="say">a short line <span class="arrow">→</span></span></span></a>
    <a href="#project-2"><span class="name">Project two</span><span class="meta"><span class="terr">Category</span><span class="say">a short line <span class="arrow">→</span></span></span></a>
    <a href="#project-3"><span class="name">Project three</span><span class="meta"><span class="terr">Category</span><span class="say">a short line <span class="arrow">→</span></span></span></a>
    <a href="#project-4"><span class="name">Project four</span><span class="meta"><span class="terr">Category</span><span class="say">a short line <span class="arrow">→</span></span></span></a>
  </nav>
</main>
</body>
</html>
