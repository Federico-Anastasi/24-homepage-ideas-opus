<!doctype html>
<!-- HOW TO USE (this page is a template)
     Title: in the <title> and the <h1> (search for "Your open space" and "First Last").
     Projects: in the four <a> links of this page (name, short line and #project-N address).
     Icons: the four files ../assets/project-1.svg ... project-4.svg (replace them, or change the src of the <img> tags).
     Also replace the #project-1 ... #project-4 links with the addresses of your own projects. -->
<!-- Liquid chrome: a lake of chrome that ripples and reflects a photo studio drawn in a shader;
     the four projects are four chrome droplets with engraved names, and the reflection follows the finger. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Your open space by First Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ang: 118deg; --font: "Big Shoulders Display", "Arial Narrow", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0c0e; overflow: hidden; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .stage {
    position: fixed; inset: 0; margin: 0 auto; max-width: 480px;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: clamp(14px, 3svh, 26px);
  }

  /* Chrome title: banded gradient like a mirrored object, dark horizon halfway through the letter */
  h1 {
    margin: 0; font-weight: 900; text-transform: uppercase;
    font-size: clamp(42px, 12.6vw, 58px); line-height: .9; letter-spacing: -.005em;
    background:
      linear-gradient(var(--ang), rgba(255,255,255,0) 30%, rgba(255,255,255,.85) 46%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #ffffff 0%, #dfe3e8 30%, #8b929a 47%, #2b2f35 52%, #c9ced4 58%, #f6f7f9 78%, #a8aeb5 100%);
    /* the chrome repeats row by row: each row has its own horizon, none ends in the dark band */
    background-size: 100% 100%, 100% .9em; background-repeat: no-repeat, repeat-y;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }

  /* Four droplets in two staggered columns: the right one sits half a step lower */
  .drops {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: clamp(12px, 2.4svh, 20px) 14px;
  }
  .drop:nth-child(2n) { transform: translateY(9%); }
  .drop:nth-child(2n):active { transform: translateY(9%) scale(.96); }

  .drop {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.3svh, 12px); padding: 12px; text-decoration: none; min-height: 44px;
    background:
      radial-gradient(120% 70% at 30% 8%, rgba(255,255,255,.75), rgba(255,255,255,0) 45%),
      linear-gradient(var(--ang), #fbfcfd 0%, #b3b9c1 16%, #ffffff 31%, #626870 49%, #dfe3e8 66%, #858c95 83%, #f0f2f5 100%);
    box-shadow:
      0 22px 34px -14px rgba(0,0,0,.8),
      0 2px 1px rgba(255,255,255,.65) inset,
      0 -6px 12px rgba(0,0,0,.35) inset,
      0 0 0 1px rgba(0,0,0,.45);
    transition: transform .18s ease, filter .18s ease;
    animation: melt 9s ease-in-out infinite alternate;
  }
  .drop:active { transform: scale(.96); filter: brightness(1.12); }
  .drop:nth-child(1) { border-radius: 48% 52% 44% 56% / 55% 47% 53% 45%; animation-delay: -1s; }
  .drop:nth-child(2) { border-radius: 56% 44% 52% 48% / 46% 56% 44% 54%; animation-delay: -4s; }
  .drop:nth-child(3) { border-radius: 44% 56% 58% 42% / 52% 44% 56% 48%; animation-delay: -6s; }
  .drop:nth-child(4) { border-radius: 52% 48% 46% 54% / 44% 54% 46% 56%; animation-delay: -2.5s; }
  @keyframes melt {
    0%   { border-radius: 48% 52% 44% 56% / 55% 47% 53% 45%; }
    50%  { border-radius: 55% 45% 53% 47% / 47% 55% 45% 53%; }
    100% { border-radius: 45% 55% 49% 51% / 52% 46% 56% 44%; }
  }

  /* The icon well: carved into the metal */
  .well {
    width: clamp(46px, 9svh, 64px); height: clamp(46px, 9svh, 64px); border-radius: 50%; flex: none;
    background: #15171a; display: grid; place-items: center;
    box-shadow: 0 3px 7px rgba(0,0,0,.85) inset, 0 -1px 0 rgba(0,0,0,.4) inset, 0 1px 0 rgba(255,255,255,.9), 0 0 0 3px rgba(0,0,0,.08);
  }
  .well img { width: 84%; height: 84%; border-radius: 50%; object-fit: cover; display: block; }
  .well img.pad { object-fit: contain; width: 64%; height: 64%; border-radius: 0; }

  /* Engraved name: dark in the groove, light on the lower edge */
  .name {
    font-weight: 800; text-transform: uppercase; font-size: clamp(21px, 3.4svh, 27px); line-height: .95; text-align: center;
    color: #30353b; text-shadow: 0 1px 0 rgba(255,255,255,.85), 0 -1px 0 rgba(0,0,0,.28);
  }
  .word {
    font-weight: 700; font-size: clamp(14px, 2.1svh, 16px); letter-spacing: .01em; text-align: center; line-height: 1.05;
    color: #4a5058; text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }

  @media (max-height: 600px) { .word { display: none; } }
  @media (prefers-reduced-motion: reduce) { .drop { animation: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main class="stage">
  <h1>Your open space by First Last</h1>
  <nav class="drops" aria-label="Projects">
    <a class="drop" href="#project-1"><span class="well"><img src="../assets/project-1.svg" alt=""></span><span class="name">Project one</span><span class="word">a short line</span></a>
    <a class="drop" href="#project-2"><span class="well"><img class="pad" src="../assets/project-2.svg" alt=""></span><span class="name">Project two</span><span class="word">a short line</span></a>
    <a class="drop" href="#project-3"><span class="well"><img class="pad" src="../assets/project-3.svg" alt=""></span><span class="name">Project three</span><span class="word">a short line</span></a>
    <a class="drop" href="#project-4"><span class="well"><img src="../assets/project-4.svg" alt=""></span><span class="name">Project four</span><span class="word">a short line</span></a>
  </nav>
</main>

<script>
(() => {
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;

  // The reflection on the droplets and title follows the finger (or drifts slowly on its own until someone touches)
  let px = 0.5, py = 0.35, tx = 0.5, ty = 0.35, touched = false, ripple = 0;
  addEventListener("pointermove", (e) => { tx = e.clientX / innerWidth; ty = e.clientY / innerHeight; touched = true; }, { passive: true });
  addEventListener("pointerdown", (e) => { tx = e.clientX / innerWidth; ty = e.clientY / innerHeight; touched = true; ripple = 1; }, { passive: true });

  if (!gl) { canvas.style.background = "radial-gradient(120% 80% at 50% 0%, #3a3e44, #0b0c0e)"; return; }

  const vs = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  const fs = `
precision mediump float;
uniform vec2 R; uniform float T; uniform vec2 M; uniform float D;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float H(vec2 p){
  float t=T*.16;
  float h=fbm(p*1.35+vec2(t,-t*.7))*.95;
  h+=.22*sin(p.x*2.1+t*2.3)*sin(p.y*1.6-t*1.5);
  vec2 d=p-M; float r=length(d);
  h+=D*.32*exp(-r*2.2)*sin(r*15.-T*5.5);
  return h;
}
vec3 env(vec3 r){
  float y=r.y*.5+.5;
  vec3 c=mix(vec3(.035,.04,.045),vec3(.30,.32,.35),smoothstep(.05,.95,y));
  c+=vec3(1.)*smoothstep(.78,.9,r.y)*smoothstep(.65,.15,abs(r.x))*1.7;
  c+=vec3(.88,.94,1.)*smoothstep(.07,0.,abs(r.x-.7))*smoothstep(-.45,.55,r.y)*1.25;
  c+=vec3(.86,.9,1.)*smoothstep(.05,0.,abs(r.x+.78))*smoothstep(-.25,.6,r.y)*.75;
  c+=vec3(1.,.66,.32)*smoothstep(-.5,-.88,r.y)*.6;
  return c;
}
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 p=(gl_FragCoord.xy-.5*R)/R.y*2.;
  float e=1.5/R.y;
  float hx=H(p+vec2(e,0.))-H(p-vec2(e,0.));
  float hy=H(p+vec2(0.,e))-H(p-vec2(0.,e));
  vec3 n=normalize(vec3(-hx/(2.*e)*.55,-hy/(2.*e)*.55,1.));
  vec3 v=vec3(0.,0.,1.);
  vec3 r=reflect(-v,n);
  vec3 col=env(r);
  float fres=pow(1.-clamp(n.z,0.,1.),2.5);
  col+=fres*.35;
  vec3 L=normalize(vec3(M-p,.85));
  float s=pow(max(dot(reflect(-L,n),v),0.),70.);
  col+=s*vec3(1.,.93,.82)*.9;
  col=col/(col+.55)*1.45;
  col*=1.-.55*dot(uv-vec2(.5,.62),uv-vec2(.5,.62));
  gl_FragColor=vec4(pow(col,vec3(.92)),1.);
}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.background = "radial-gradient(120% 80% at 50% 0%, #3a3e44, #0b0c0e)"; return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(prog, "R"), uT = gl.getUniformLocation(prog, "T");
  const uM = gl.getUniformLocation(prog, "M"), uD = gl.getUniformLocation(prog, "D");

  // Liquid chrome is soft: it is computed at reduced resolution and scaled up, so it holds 60fps on a phone
  const SCALE = 0.62;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(innerWidth * dpr * SCALE));
    canvas.height = Math.max(1, Math.round(innerHeight * dpr * SCALE));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  addEventListener("resize", () => { resize(); if (reduce) requestAnimationFrame(frame); });

  let raf = 0, t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    if (!touched) { tx = 0.5 + Math.sin(t * 0.35) * 0.32; ty = 0.32 + Math.sin(t * 0.23) * 0.1; }
    px += (tx - px) * 0.08; py += (ty - py) * 0.08;
    ripple *= 0.985;
    const aspect = canvas.width / canvas.height;
    gl.uniform2f(uR, canvas.width, canvas.height);
    gl.uniform1f(uT, t);
    gl.uniform2f(uM, (px - 0.5) * 2 * aspect, (0.5 - py) * 2);
    gl.uniform1f(uD, 0.25 + ripple);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    root.style.setProperty("--ang", (70 + px * 100).toFixed(1) + "deg");
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(raf);
    if (!document.hidden && !reduce) { raf = requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
