<!doctype html>
<!-- HOW TO USE (this page is a template)
     Title: in the <title> and the <h1> (search for "Your open space" and "First Last").
     Projects: in the four <a> links of this page (name, short line and #project-N address); the 3D stations are in the script, one per project.
     Icons: ../assets/project-1.svg and project-4.svg are pasted on the sphere and on the phone; the other stations use no images.
     Also replace the #project-1 ... #project-4 links with the addresses of your own projects. -->
<!-- 22 · Diorama — the page as a small isometric room in the evening, warm lights, four stations (one per project);
     rotate it with your finger, touch a station or its label and you go in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b30">
<title>Your open space by First Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: #fff4e6; -webkit-tap-highlight-color: transparent; }
  body {
    background:
      radial-gradient(70% 45% at 50% 62%, rgba(255, 170, 90, .16) 0%, rgba(255, 170, 90, 0) 70%),
      linear-gradient(180deg, #10162a 0%, #1a2240 55%, #241f33 100%);
    background-color: #151b30;
  }
  #stage { position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, 480px); transform: translateX(-50%); touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  h1 {
    position: absolute; z-index: 2; left: 24px; right: 24px; top: max(26px, calc(env(safe-area-inset-top) + 14px)); margin: 0;
    font: 400 clamp(29px, 8.6vw, 38px)/1.05 "Young Serif", Georgia, serif; letter-spacing: -.005em; pointer-events: none;
  }
  h1 span { display: block; margin-top: .3em; font-size: .58em; color: #f2c99a; }
  .pin {
    position: absolute; z-index: 3; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: inherit; transform: translate(-50%, -100%); min-height: 44px;
    font-family: Karla, system-ui, sans-serif; will-change: transform;
  }
  .pin .tag {
    padding: 7px 11px 8px; border-radius: 12px; text-align: center; white-space: nowrap;
    background: rgba(18, 20, 34, .78); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 220, 180, .14);
    transition: transform .15s ease, background-color .15s ease;
  }
  .pin b { display: block; font-size: 16px; font-weight: 700; color: #fff; }
  .pin i { display: block; font-style: normal; font-size: 13px; color: #f2c99a; margin-top: 1px; }
  .pin .stem { width: 1.5px; height: 16px; background: linear-gradient(#f2c99a, rgba(242, 201, 154, .2)); }
  .pin .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffb35c; box-shadow: 0 0 0 4px rgba(255, 179, 92, .22); }
  .pin:active .tag, .pin.on .tag { transform: scale(.96); background: #ffb35c; }
  .pin:active b, .pin:active i, .pin.on b, .pin.on i { color: #1b1408; }
  .pin:focus-visible .tag { outline: 2px solid #ffb35c; outline-offset: 3px; }
  .hint { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); text-align: center;
    font: 500 13px Karla, system-ui, sans-serif; color: rgba(255, 236, 214, .55); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <h1>Your open space <span>by First Last</span></h1>
  <a class="pin" href="#project-1" data-slug="one"><span class="tag"><b>Project one</b><i>a short line</i></span><span class="stem"></span><span class="dot"></span></a>
  <a class="pin" href="#project-2" data-slug="two"><span class="tag"><b>Project two</b><i>a short line</i></span><span class="stem"></span><span class="dot"></span></a>
  <a class="pin" href="#project-3" data-slug="three"><span class="tag"><b>Project three</b><i>a short line</i></span><span class="stem"></span><span class="dot"></span></a>
  <a class="pin" href="#project-4" data-slug="four"><span class="tag"><b>Project four</b><i>a short line</i></span><span class="stem"></span><span class="dot"></span></a>
  <div class="hint">drag to rotate the room</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const IMG = "../assets/";
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("c");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -50, 50);
  const ISO = new THREE.Vector3(1, 0.86, 1).normalize();
  camera.position.copy(ISO).multiplyScalar(20);
  camera.lookAt(0, 0, 0);

  const room = new THREE.Group();
  scene.add(room);

  // ---------- Helpers ----------
  const std = (color, rough = .7, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: 0 }, extra));
  function rbox(w, h, d, r, mat) {
    r = Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001);
    const s = new THREE.Shape();
    s.moveTo(-(w / 2 - r), -(h / 2 - r)); s.lineTo(w / 2 - r, -(h / 2 - r)); s.lineTo(w / 2 - r, h / 2 - r); s.lineTo(-(w / 2 - r), h / 2 - r);
    const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 4, curveSegments: 6 });
    g.center(); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function cyl(rt, rb, h, mat, seg = 24) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = true; m.receiveShadow = true; return m;
  }
  const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };
  const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  function canvasTex(w, h, paint) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); paint(g, w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    t.repaint = (fn) => { fn(g, w, h); t.needsUpdate = true; };
    return t;
  }

  // ---------- The room ----------
  const S = 4.4, H = 2.5, T = 0.16;
  const floorTex = canvasTex(512, 512, (g, w, h) => {
    const tones = ["#b88352", "#ad794a", "#c08b5a", "#a9744a", "#b5804f"];
    for (let i = 0; i < 8; i++) {
      g.fillStyle = tones[i % tones.length]; g.fillRect(i * 64, 0, 64, h);
      for (let k = 0; k < 40; k++) { g.fillStyle = `rgba(80,45,20,${Math.random() * .08})`; g.fillRect(i * 64 + Math.random() * 64, Math.random() * h, 1 + Math.random() * 2, 20 + Math.random() * 90); }
      g.fillStyle = "rgba(60,32,14,.55)"; g.fillRect(i * 64, 0, 1.5, h);
      const cut = (i * 173) % h; g.fillRect(i * 64, cut, 64, 1.5);
    }
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(1.4, 1.4);
  const floor = rbox(S, T, S, .04, std(0xffffff, .62, { map: floorTex }));
  at(floor, 0, -T / 2, 0); room.add(floor);

  const wallBack = rbox(S + T, H, T, .03, std(0xc9694a, .9));
  at(wallBack, T / 2 - T / 2, H / 2, -S / 2 - T / 2); room.add(wallBack);
  const wallLeft = rbox(T, H, S, .03, std(0xeadbc4, .9));
  at(wallLeft, -S / 2 - T / 2, H / 2, 0); room.add(wallLeft);
  // baseboard
  room.add(at(rbox(S, .1, .03, .01, std(0x8f4a33, .6)), 0, .05, -S / 2 + .015));
  room.add(at(rbox(.03, .1, S, .01, std(0xc7b59a, .6)), -S / 2 + .015, .05, 0));

  // the evening window on the back wall
  const nightTex = canvasTex(256, 320, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, "#0e1a3d"); grd.addColorStop(.7, "#2b3f78"); grd.addColorStop(1, "#c56f55");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = "#fff6dc"; g.beginPath(); g.arc(70, 70, 16, 0, Math.PI * 2); g.fill();
    for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(255,255,255,${.3 + Math.random() * .6})`; g.fillRect(Math.random() * w, Math.random() * h * .6, 2, 2); }
    g.fillStyle = "#121a33"; for (let i = 0; i < 7; i++) { const bw = 26 + Math.random() * 20, bh = 40 + Math.random() * 70; g.fillRect(i * 38 - 6, h - bh, bw, bh); }
  });
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(.92, 1.12), new THREE.MeshBasicMaterial({ map: nightTex, toneMapped: false }));
  at(pane, .95, 1.45, -S / 2 + .012); room.add(pane);
  const frameMat = std(0xf3e6d2, .5);
  [[0, .58, 1.04, .06], [0, -.58, 1.04, .06], [-.49, 0, .06, 1.22], [.49, 0, .06, 1.22], [0, 0, .03, 1.12], [0, .05, .92, .03]].forEach(([x, y, w, h]) =>
    room.add(at(rbox(w, h, .06, .01, frameMat), .95 + x, 1.45 + y, -S / 2 + .03)));
  room.add(at(rbox(1.12, .05, .14, .015, frameMat), .95, .86, -S / 2 + .07));

  // shelf with books on the left wall
  room.add(at(rbox(.2, .05, 1.3, .01, std(0x6b3f27, .5)), -S / 2 + .1, 1.78, -.15));
  const books = ["#e2553a", "#1f4b99", "#ffb21e", "#ff6fae", "#2a2a36", "#e8d6b5", "#c9694a"];
  let bz = -.72;
  books.forEach((c, i) => { const th = .07 + (i % 3) * .02, bh = .24 + ((i * 37) % 10) / 100;
    room.add(at(rbox(.17, bh, th, .008, std(c, .65)), -S / 2 + .1, 1.805 + bh / 2, bz + th / 2)); bz += th + .012; });

  // ---------- The stations ----------
  const stations = {};
  function station(slug, x, z) { const g = new THREE.Group(); g.position.set(x, 0, z); g.userData.slug = slug; room.add(g); stations[slug] = g; return g; }
  function decalSphere(r, img, base) {
    const tex = canvasTex(1024, 512, (g) => { g.fillStyle = base; g.fillRect(0, 0, 1024, 512); });
    loadImg(img).then((im) => { if (!im) return; tex.repaint((g) => { const s = 240; g.save(); g.beginPath(); g.arc(256, 256, s / 2, 0, Math.PI * 2); g.clip(); g.drawImage(im, 256 - s / 2, 256 - s / 2, s, s); g.restore(); }); kick(); });
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), new THREE.MeshStandardMaterial({ map: tex, roughness: .35 }));
    m.castShadow = true; return m;
  }

  // Project three: desk in the corner, monitor with code, the PC with the orange LED
  (() => {
    const g = station("three", -1.2, -1.3);
    const wood = std(0x7b4a2c, .55), dark = std(0x23242c, .45), metal = std(0x9aa0aa, .35, { metalness: .6 });
    g.add(at(rbox(1.5, .06, .78, .02, wood), 0, .74, 0));
    [[-.68, -.33], [.68, -.33], [-.68, .33], [.68, .33]].forEach(([x, z]) => g.add(at(rbox(.05, .72, .05, .01, wood), x, .36, z)));
    g.add(at(rbox(.08, .26, .06, .01, metal), 0, .9, -.2));
    g.add(at(rbox(.36, .02, .22, .01, metal), 0, .78, -.2));
    const mon = at(rbox(.92, .56, .045, .02, dark), 0, 1.24, -.22); g.add(mon);
    const codeTex = canvasTex(512, 300, (c, w, h) => {
      c.fillStyle = "#0d1322"; c.fillRect(0, 0, w, h);
      const cols = ["#FFD84A", "#FFA61F", "#F0532B", "#8fb4ff", "#e9eef8"];
      for (let i = 0; i < 12; i++) { const ind = (i % 4) * 22; c.fillStyle = cols[(i * 3) % cols.length]; c.fillRect(24 + ind, 22 + i * 22, 70 + ((i * 97) % 260), 9); c.fillStyle = "rgba(255,255,255,.25)"; c.fillRect(24 + ind + 90 + ((i * 97) % 260), 22 + i * 22, 40, 9); }
    });
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(.84, .48), new THREE.MeshBasicMaterial({ map: codeTex, toneMapped: false }));
    at(screen, 0, 1.24, -.195); g.add(screen);
    g.add(at(rbox(.5, .025, .16, .01, std(0x2e2f38, .5)), -.05, .785, .14));          // keyboard
    g.add(at(rbox(.07, .025, .1, .02, std(0x2e2f38, .5)), .38, .785, .15));            // mouse
    const mug = at(cyl(.045, .04, .1, std(0xffb21e, .4)), -.55, .82, .1); g.add(mug);
    const tower = at(rbox(.26, .52, .5, .02, dark), .62, .26, .02); g.add(tower);
    g.add(at(new THREE.Mesh(new THREE.BoxGeometry(.02, .02, .02), new THREE.MeshBasicMaterial({ color: 0xffa12a, toneMapped: false })), .62, .45, .28));
    const stool = new THREE.Group(); stool.add(at(cyl(.2, .2, .07, std(0x2f3550, .6)), 0, .5, 0), at(cyl(.025, .025, .47, metal), 0, .25, 0), at(cyl(.18, .18, .02, metal), 0, .01, 0));
    stool.position.set(0, 0, .68); g.add(stool);
    const glow = new THREE.PointLight(0xffa860, .55, 2.4, 2); glow.position.set(0, 1.2, .2); g.add(glow);
  })();

  // Project two: tripod with the camera aimed at the armchair, and a softbox turned on
  (() => {
    const g = station("two", 1.15, -1.05);
    const black = std(0x1d1e24, .4), metal = std(0x8e939c, .3, { metalness: .7 });
    const rig = new THREE.Group(); g.add(rig);
    const dir = new THREE.Vector2(-1.3 - 1.15, 1.0 + 1.05).normalize();
    rig.rotation.y = Math.atan2(dir.x, dir.y);
    // three legs starting from the head and spreading toward the floor
    const tilt = .3, L = 1.08 / Math.cos(tilt);
    for (let i = 0; i < 3; i++) {
      const hinge = new THREE.Group(); hinge.position.y = 1.08; hinge.rotation.y = i / 3 * Math.PI * 2 + .5;
      const leg = cyl(.018, .013, L, metal, 8); leg.geometry.translate(0, -L / 2, 0); leg.rotation.z = tilt;
      hinge.add(leg); rig.add(hinge);
    }
    rig.add(at(cyl(.05, .05, .1, metal, 12), 0, 1.08, 0));
    const body = at(rbox(.34, .22, .22, .04, black), 0, 1.24, 0); rig.add(body);
    const lens = cyl(.075, .085, .2, std(0x111216, .25), 24); lens.rotation.x = Math.PI / 2; at(lens, 0, 1.24, .2); rig.add(lens);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(.062, 24), new THREE.MeshStandardMaterial({ color: 0x3a4f8a, roughness: .05, metalness: .3, emissive: 0x13204a }));
    at(glass, 0, 1.24, .301); rig.add(glass);
    rig.add(at(new THREE.Mesh(new THREE.SphereGeometry(.018, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff3b2f, toneMapped: false })), .12, 1.33, .1));
    // softbox
    const sb = new THREE.Group(); sb.position.set(.55, 0, -.5); sb.rotation.y = rig.rotation.y; g.add(sb);
    sb.add(at(cyl(.015, .015, 1.3, metal, 8), 0, .65, 0));
    sb.add(at(rbox(.62, .62, .2, .03, black), 0, 1.45, 0));
    const face = new THREE.Mesh(new THREE.PlaneGeometry(.56, .56), new THREE.MeshBasicMaterial({ color: 0xfff3e0, toneMapped: false }));
    at(face, 0, 1.45, .102); sb.add(face);
    const sbl = new THREE.PointLight(0xfff0dc, .7, 3, 2); sbl.position.set(0, 1.45, .4); sb.add(sbl);
  })();

  // Project one: the armchair near the lamp, and a sphere with the icon sitting there, looking at you
  (() => {
    const g = station("one", -1.25, 1.0);
    const rug = new THREE.Mesh(new THREE.CylinderGeometry(.82, .82, .012, 48), std(0xe2553a, .95));
    rug.receiveShadow = true; at(rug, .45, .006, 0); g.add(rug);
    const rugIn = new THREE.Mesh(new THREE.RingGeometry(.55, .6, 48), std(0xffb21e, .95)); rugIn.rotation.x = -Math.PI / 2; at(rugIn, .45, .014, 0); g.add(rugIn);
    const fabric = std(0x2b4a8a, .95), legs = std(0x5a3520, .5);
    const chair = new THREE.Group(); chair.rotation.y = Math.PI / 2; g.add(chair);
    chair.add(at(rbox(.86, .26, .78, .1, fabric), 0, .3, 0));
    chair.add(at(rbox(.86, .62, .2, .1, fabric), 0, .64, -.32));
    chair.add(at(rbox(.16, .4, .78, .08, fabric), -.43, .46, 0));
    chair.add(at(rbox(.16, .4, .78, .08, fabric), .43, .46, 0));
    chair.add(at(rbox(.6, .1, .5, .05, std(0x3a5ea3, .95)), 0, .47, .06));
    [[-.36, -.3], [.36, -.3], [-.36, .3], [.36, .3]].forEach(([x, z]) => chair.add(at(cyl(.03, .02, .18, legs, 8), x, .09, z)));
    const one = decalSphere(.25, IMG + "project-1.svg", "#1d2f57");
    one.rotation.y = Math.PI / 4 + .25; at(one, .04, .78, 0); g.add(one);
    // floor lamp
    const lamp = new THREE.Group(); lamp.position.set(-.45, 0, -.62); g.add(lamp);
    lamp.add(at(cyl(.16, .18, .04, std(0x2a2a30, .4)), 0, .02, 0));
    lamp.add(at(cyl(.016, .016, 1.5, std(0x2a2a30, .4), 8), 0, .76, 0));
    const shade = cyl(.12, .24, .28, new THREE.MeshStandardMaterial({ color: 0xffd7a0, emissive: 0xffa24d, emissiveIntensity: .9, roughness: .8, side: THREE.DoubleSide }), 28);
    shade.castShadow = false; at(shade, 0, 1.56, 0); lamp.add(shade);
    const bulb = new THREE.PointLight(0xffa85a, 1.5, 3.4, 2); bulb.position.set(0, 1.45, 0); lamp.add(bulb);
  })();

  // Project four: the round side table with the phone charging, the icon on the screen
  (() => {
    const g = station("four", 1.15, 1.15);
    const wood = std(0xd9b48a, .5);
    g.add(at(cyl(.36, .36, .045, wood, 40), 0, .58, 0));
    g.add(at(cyl(.035, .05, .56, std(0x2a2a30, .4), 12), 0, .29, 0));
    g.add(at(cyl(.2, .22, .03, std(0x2a2a30, .4), 24), 0, .015, 0));
    const dock = at(rbox(.16, .05, .12, .02, std(0xf4ede4, .4)), 0, .63, 0); g.add(dock);
    const phone = new THREE.Group(); phone.position.set(0, .8, -.01); phone.rotation.y = Math.PI / 4; phone.rotation.x = -.18; g.add(phone);
    phone.add(rbox(.2, .38, .028, .012, std(0xff5fa2, .35)));
    const scr = canvasTex(200, 380, (c, w, h) => { const grd = c.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, "#3c4156"); grd.addColorStop(1, "#14161f"); c.fillStyle = grd; c.fillRect(0, 0, w, h); });
    loadImg(IMG + "project-4.svg").then((im) => { if (!im) return; scr.repaint((c) => { c.save(); c.beginPath(); c.arc(100, 160, 70, 0, Math.PI * 2); c.clip(); c.drawImage(im, 30, 90, 140, 140); c.restore(); c.fillStyle = "#fff"; c.font = "600 16px system-ui,sans-serif"; c.fillText("Your text here", 40, 300); }); kick(); });
    phone.add(at(new THREE.Mesh(new THREE.PlaneGeometry(.176, .346), new THREE.MeshBasicMaterial({ map: scr, toneMapped: false })), 0, 0, .0145));
    // a pot with a round plant, for the homey feel
    const pot = at(cyl(.06, .05, .1, std(0xc9694a, .7)), -.2, .65, .14); g.add(pot);
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(.09, 1), std(0x2f6b4f, .8)); leaf.castShadow = true; at(leaf, -.2, .77, .14); g.add(leaf);
  })();

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xffe2c4, 0x2a2440, .55));
  const key = new THREE.DirectionalLight(0xffd6a6, 1.05);
  key.position.set(4.5, 7, 3); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0006; key.shadow.normalBias = .02;
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
  scene.add(key);
  const moon = new THREE.DirectionalLight(0x8fa6ff, .35); moon.position.set(1, 3, -6); scene.add(moon);

  // ---------- Layout: the room sits under the title ----------
  let W = 1, Hs = 1;
  function layout() {
    W = stage.clientWidth; Hs = stage.clientHeight;
    renderer.setSize(W, Hs, false);
    camera.updateMatrixWorld();
    const inv = camera.matrixWorldInverse, p = new THREE.Vector3();
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const x of [-2.4, 2.3]) for (const y of [0, H, 2.05]) for (const z of [-2.4, 2.3]) {
      p.set(x, y, z).applyMatrix4(inv);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
    const aspect = W / Hs;
    const titleFrac = Math.min(.34, (document.querySelector("h1").getBoundingClientRect().bottom + 70) / Hs);
    const bottomFrac = .07, avail = 1 - titleFrac - bottomFrac;
    const fwNeed = (maxX - minX) * 1.08;
    let fh = Math.max(fwNeed / aspect, (maxY - minY) / avail);
    const fw = fh * aspect, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const top = cy + (titleFrac + avail / 2) * fh;
    Object.assign(camera, { left: cx - fw / 2, right: cx + fw / 2, top, bottom: top - fh });
    camera.updateProjectionMatrix();
    kick();
  }

  // ---------- Anchored labels ----------
  const anchors = {
    "three": new THREE.Vector3(-1.2, 1.62, -1.5),
    "two": new THREE.Vector3(1.15, 1.85, -1.05),
    "one": new THREE.Vector3(-1.2, 1.12, 1.0),
    "four": new THREE.Vector3(1.15, 1.05, 1.15),
  };
  const pins = [...document.querySelectorAll(".pin")];
  const tmp = new THREE.Vector3();
  function place() {
    room.updateMatrixWorld();
    for (const el of pins) {
      tmp.copy(anchors[el.dataset.slug]).applyMatrix4(room.matrixWorld).project(camera);
      el.style.transform = `translate(${(tmp.x + 1) / 2 * W}px, ${(1 - tmp.y) / 2 * Hs}px) translate(-50%, -100%)`;
    }
  }

  // ---------- Finger: rotates the room; a touch on a station opens it ----------
  let rot = 0, rotTarget = 0, dragging = false, startX = 0, startRot = 0, moved = 0, t = 0;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  canvas.addEventListener("pointerdown", (e) => { dragging = true; startX = e.clientX; startRot = rotTarget; moved = 0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    moved = Math.max(moved, Math.abs(e.clientX - startX));
    rotTarget = Math.max(-.55, Math.min(.55, startRot + (e.clientX - startX) * .006));
    kick();
  });
  canvas.addEventListener("pointerup", (e) => {
    dragging = false;
    if (moved > 8) return;
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(Object.values(stations), true)[0];
    if (!hit) return;
    let o = hit.object; while (o && !o.userData.slug) o = o.parent;
    if (o) go(o.userData.slug);
  });
  function go(slug) {
    const el = pins.find((p) => p.dataset.slug === slug);
    el.classList.add("on");
    setTimeout(() => { location.href = el.href; }, reduce ? 0 : 220);
  }

  // ---------- Loop ----------
  let raf = 0, last = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000 || .016); last = now; t += dt;
    if (!dragging) rotTarget *= Math.pow(.35, dt);           // slowly returns to its place
    rot += (rotTarget - rot) * (1 - Math.pow(.002, dt));
    room.rotation.y = rot + Math.sin(t * .28) * .05;
    renderer.render(scene, camera); place();
  }
  function kick() {
    if (reduce) { room.rotation.y = rotTarget; renderer.render(scene, camera); place(); return; }
    if (!raf && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else kick(); });
  addEventListener("resize", layout);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(layout);
  layout();
})();
</script>
</body>
</html>
