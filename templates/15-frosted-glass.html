<!doctype html>
<!-- HOW TO USE (this page is a template)
     Title: in the <title> and the <h1>, split in several elements around the word "open" (search for "First Last").
     Projects: in the four <a> links of this page (name, short line and #project-N address).
     Icons: the four files ../assets/project-1.svg ... project-4.svg (replace them, or change the src of the <img> tags).
     Also replace the #project-1 ... #project-4 links with the addresses of your own projects. -->
<!-- 15 · Glass and light — slabs of thick glass over slow-moving coloured lights: the edges really refract
     (WebGL shader), caustics drift behind like at the bottom of a pool; the text is engraved in Bodoni. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Your open space by First Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080d; }
  body {
    overflow: hidden; color: #fff; font-family: "Bodoni Moda", Didot, "Bodoni 72", serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .stage {
    position: relative; height: 100%; max-width: 480px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    display: grid; gap: 12px; grid-template-rows: auto 1fr;
  }
  .slab { position: relative; border-radius: 22px; }
  .title { padding: clamp(18px, 3.4svh, 28px) 22px clamp(18px, 3.2svh, 26px); }
  /* engraved text: light, with the shadow edge of something carved into glass */
  .etch {
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.7));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(255,255,255,.12));
  }
  h1 { margin: 0; font-weight: 500; line-height: .98; letter-spacing: -.01em; }
  h1 .a { display: block; font-size: clamp(36px, 10.4vw, 46px); font-variation-settings: "opsz" 96; }
  h1 .b { display: block; font-style: italic; font-weight: 400; font-size: clamp(36px, 10.4vw, 46px); font-variation-settings: "opsz" 96; }
  h1 .c { display: block; margin-top: .55em; font-size: clamp(15px, 2.6svh, 18px); font-weight: 500; letter-spacing: .02em; font-variation-settings: "opsz" 14; }

  .apps { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 12px; min-height: 0; }
  .app {
    display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: inherit;
    padding: clamp(12px, 2.2svh, 18px) 16px; min-height: 44px; transition: transform .15s ease;
  }
  .app:active { transform: scale(.97); }
  .one { grid-column: 1; grid-row: 1 / 3; }
  .anim { grid-column: 1; grid-row: 3; }
  .code { grid-column: 2; grid-row: 1; }
  .four  { grid-column: 2; grid-row: 2 / 4; }
  .ico {
    width: clamp(30px, 5.4svh, 40px); height: clamp(30px, 5.4svh, 40px); border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.35); background: rgba(255,255,255,.9);
  }
  .ico.pad { object-fit: contain; padding: 6px; }
  .name { display: block; font-size: clamp(22px, 4.1svh, 28px); font-weight: 600; line-height: 1.02; font-variation-settings: "opsz" 48; }
  .say { display: block; margin-top: .25em; font-style: italic; font-size: clamp(14px, 2.3svh, 16px); opacity: .9; }

  /* without WebGL: glass using the browser's own means */
  .nogl body, html.nogl { background: radial-gradient(60% 50% at 25% 75%, #c2552f, transparent), radial-gradient(55% 45% at 80% 25%, #2d4fd0, transparent), radial-gradient(40% 40% at 70% 80%, #c23a8f, transparent), #07080d; }
  .nogl .slab { background: rgba(255,255,255,.08); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.14), 0 18px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<main class="stage">
  <div class="slab title">
    <h1 class="etch"><span class="a">Your</span><span class="b">open</span><span class="c">space by First Last</span></h1>
  </div>
  <nav class="apps" aria-label="Projects">
    <a class="slab app one" href="#project-1"><img class="ico" src="../assets/project-1.svg" alt=""><span><span class="name etch">Project one</span><span class="say etch">a short line</span></span></a>
    <a class="slab app code" href="#project-3"><img class="ico pad" src="../assets/project-3.svg" alt=""><span><span class="name etch">Project three</span><span class="say etch">a short line</span></span></a>
    <a class="slab app anim" href="#project-2"><img class="ico pad" src="../assets/project-2.svg" alt=""><span><span class="name etch">Project two</span><span class="say etch">a short line</span></span></a>
    <a class="slab app four" href="#project-4"><img class="ico" src="../assets/project-4.svg" alt=""><span><span class="name etch">Project four</span><span class="say etch">a short line</span></span></a>
  </nav>
</main>

<script>
(() => {
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) { document.documentElement.classList.add("nogl"); return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 5;

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
  const fs = `
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec4 uR[${N}]; uniform float uRad; uniform float uS; uniform vec2 uPtr;

float blob(vec2 p, vec2 c, float r){ vec2 d = p - c; return exp(-dot(d, d) / (r * r)); }

// the lights behind the glass (coordinates in units of height)
vec3 lights(vec2 px){
  vec2 p = px / uRes.y; float t = uTime; float a = uRes.x / uRes.y;
  vec3 col = vec3(0.028, 0.032, 0.055);
  col += blob(p, vec2(a * (0.25 + 0.20 * sin(t * 0.19)), 0.28 + 0.12 * cos(t * 0.23)), 0.34) * vec3(1.00, 0.42, 0.16);
  col += blob(p, vec2(a * (0.80 + 0.15 * cos(t * 0.17)), 0.78 + 0.10 * sin(t * 0.21)), 0.33) * vec3(0.20, 0.36, 1.00);
  col += blob(p, vec2(a * (0.72 + 0.18 * sin(t * 0.13 + 2.0)), 0.30 + 0.16 * sin(t * 0.11)), 0.26) * vec3(0.95, 0.22, 0.62);
  col += blob(p, vec2(a * (0.30 + 0.14 * cos(t * 0.15 + 1.0)), 0.80 + 0.08 * cos(t * 0.19)), 0.24) * vec3(1.00, 0.74, 0.22);
  col += blob(p, uPtr / uRes.y, 0.20) * vec3(1.00, 0.86, 0.62) * 0.55;
  return col;
}

// caustics like on the bottom of a pool
float caustic(vec2 px){
  vec2 p = mod(px / uRes.y * 5.0, 6.2831853) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005; float t = uTime * 0.22 + 23.0;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 1.0);
}

float sdRR(vec2 p, vec4 r, float rad){
  vec2 c = r.xy + r.zw * 0.5; vec2 b = r.zw * 0.5;
  vec2 q = abs(p - c) - b + rad;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - rad;
}
float F(vec2 p){ float d = 1e5; for (int i = 0; i < ${N}; i++) d = min(d, sdRR(p, uR[i], uRad)); return d; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 p = gl_FragCoord.xy;
  float d = F(p);
  vec3 col;
  if (d < 0.0) {
    float bevel = 16.0 * uS;
    float k = clamp(1.0 + d / bevel, 0.0, 1.0);                  // 1 at the edge, 0 towards the centre
    vec2 e = vec2(1.0, 0.0);
    vec2 n = vec2(F(p + e.xy) - F(p - e.xy), F(p + e.yx) - F(p - e.yx));
    n = n / max(length(n), 1e-4);
    float bend = k * k * k;
    vec2 off = -n * bend * 42.0 * uS;                             // the thick edge bends the light inwards
    vec3 s = vec3(0.0);
    for (int j = 0; j < 5; j++) {
      float a = float(j) * 1.2566;
      s += lights(p + off + vec2(cos(a), sin(a)) * (10.0 - 6.0 * bend) * uS);
    }
    s /= 5.0;
    s.r = mix(s.r, lights(p + off * 1.18).r, bend * 0.9);         // a touch of aberration on the edge
    s.b = mix(s.b, lights(p + off * 0.82).b, bend * 0.9);
    col = s * (1.08 + 0.55 * caustic(p + off));
    col += vec3(0.020, 0.024, 0.034);                             // the glass gathers light
    vec2 L = normalize(vec2(-0.55, 0.83));
    col += pow(max(dot(n, L), 0.0), 2.5) * pow(k, 5.0) * 0.55;    // reflection on the top-left edge
    col += pow(max(dot(n, -L), 0.0), 3.0) * pow(k, 7.0) * 0.12;
    col += pow(k, 22.0) * 0.22;                                   // the bright thread along the corner
    col *= 1.0 - 0.10 * smoothstep(0.0, -60.0 * uS, d);           // slightly denser at the centre
  } else {
    col = lights(p) * (0.92 + 0.95 * caustic(p));
    float ds = F(p + vec2(-6.0, 12.0) * uS);                      // shadow and light cast by the slabs
    col *= 1.0 - 0.42 * smoothstep(26.0 * uS, -4.0 * uS, ds);
    float rim = exp(-max(d, 0.0) / (5.0 * uS));
    col += rim * 0.05;
  }
  col += (hash(p + fract(uTime) * 91.0) - 0.5) * 0.022;          // grain
  col = col / (1.0 + col * 0.55);
  col = pow(col, vec3(0.94));
  gl_FragColor = vec4(col, 1.0);
}`;

  function sh(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (err) { console.warn(err); document.documentElement.classList.add("nogl"); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const uRes = U("uRes"), uTime = U("uTime"), uR = U("uR"), uRad = U("uRad"), uS = U("uS"), uPtr = U("uPtr");

  // reduced resolution: the glass is soft, the text stays in the DOM and so stays sharp
  const scale = () => Math.min(2, devicePixelRatio || 1) * 0.62;
  let s = 1, ptr = [0, 0], ptrT = [0, 0];
  const slabs = [...document.querySelectorAll(".slab")];
  function layout() {
    s = scale();
    canvas.width = Math.round(innerWidth * s); canvas.height = Math.round(innerHeight * s);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const arr = new Float32Array(N * 4);
    slabs.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      arr.set([r.left * s, (innerHeight - r.bottom) * s, r.width * s, r.height * s], i * 4);
    });
    gl.uniform4fv(uR, arr);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uRad, 22 * s);
    gl.uniform1f(uS, s);
    if (!ptr[0]) { ptr = [canvas.width * .5, canvas.height * .45]; ptrT = ptr.slice(); }
  }
  layout();
  addEventListener("resize", layout);
  if (document.fonts) document.fonts.ready.then(layout);
  addEventListener("pointermove", (e) => { ptrT = [e.clientX * s, (innerHeight - e.clientY) * s]; });
  addEventListener("pointerdown", (e) => { ptrT = [e.clientX * s, (innerHeight - e.clientY) * s]; });

  const t0 = performance.now();
  let raf = 0;
  function draw(now) {
    raf = 0;
    if (document.hidden) return;
    ptr[0] += (ptrT[0] - ptr[0]) * .06; ptr[1] += (ptrT[1] - ptr[1]) * .06;
    gl.uniform1f(uTime, reduce ? 14 : (now - t0) / 1000 + 14);
    gl.uniform2f(uPtr, ptr[0], ptr[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  raf = requestAnimationFrame(draw);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !raf) raf = requestAnimationFrame(draw); });
  if (reduce) addEventListener("resize", () => requestAnimationFrame(draw));
})();
</script>
</body>
</html>
