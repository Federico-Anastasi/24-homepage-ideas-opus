<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23 home pages: open templates</title>
<style>
  body { margin: 0; background: #1c1c1f; color: #eee; font: 500 14px/1.4 system-ui, -apple-system, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 393px); gap: 40px 32px; justify-content: center; padding: 32px 20px 80px; }
  figure { margin: 0; }
  figcaption { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  figcaption a { color: #ffb21e; text-decoration: none; }
  .phone { width: 393px; height: 659px; border-radius: 38px; overflow: hidden; background: #000; box-shadow: 0 0 0 8px #0b0b0c, 0 0 0 9px #333; }
  iframe { width: 393px; height: 659px; border: 0; display: block; }
  /* On a phone: a list to tap, each version opens full screen */
  @media (max-width: 600px) {
    .grid { display: block; padding: 16px; }
    figure { margin: 0 0 4px; }
    .phone { display: none; }
    figcaption { margin: 0; padding: 14px 4px; border-bottom: 1px solid #333; font-size: 17px; }
  }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const V = [
  "01-manifesto", "02-risograph", "03-bauhaus", "04-paper",
  "05-aurora", "06-warm-grain", "07-liquid", "09-liquid-chrome",
  "10-brushed-aluminium", "11-brass", "12-chrome-title", "13-neon-signs",
  "14-holographic", "15-frosted-glass", "16-oscilloscope", "17-terminal",
  "18-led-matrix", "19-split-flap", "20-teletext", "21-objects",
  "22-diorama", "23-particles", "24-acrylic",
];
const grid = document.getElementById("grid");
for (const v of V) {
  const name = v.replace(/^\d+-/, "").replace(/-/g, " ");
  grid.insertAdjacentHTML("beforeend",
    `<figure><figcaption><span>${v.slice(0, 2)} · ${name}</span><a href="templates/${v}.html" target="_blank">open ↗</a></figcaption>
     <div class="phone"><iframe data-src="templates/${v}.html" title="${name}"></iframe></div></figure>`);
}
// Load only the pages near the screen and unload the others: the browser can only handle a few 3D scenes at once.
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const f = e.target;
    if (e.isIntersecting) { if (!f.src || f.src === "about:blank") f.src = f.dataset.src; }
    else if (f.src && f.src !== "about:blank") f.src = "about:blank";
  }
}, { rootMargin: "300px 0px" });
if (innerWidth > 600) document.querySelectorAll("iframe").forEach((f) => io.observe(f));
</script>
</body>
</html>
